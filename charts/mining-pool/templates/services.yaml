apiVersion: v1
kind: Service
metadata:
  name: {{ include "mining-pool.stratum.name" . }}
  labels:
    {{- include "mining-pool.labels" . | nindent 4 }}
  {{- /* Stratum is a raw TCP stream — no Host header, no SNI — so an ingress
         controller has nothing to route it on. Publishing it means one thing: a
         DNS record pointing at this Service's address, so miners can be aimed at
         a name instead of whatever IP MetalLB handed out. All scopes share the
         one annotation; external-dns reads a comma-separated list. */ -}}
  {{- $ann := include "mining-pool.networking.serviceAnnotations" (dict "ctx" . "endpoint" (dig "stratum" dict (.Values.networking | default dict))) }}
  {{- if or $ann .Values.stratum.service.annotations }}
  annotations:
    {{- with $ann }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with .Values.stratum.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.stratum.service.type }}
  {{- if and (eq .Values.stratum.service.type "LoadBalancer") .Values.stratum.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.stratum.service.loadBalancerIP }}
  {{- end }}
  {{- if eq .Values.stratum.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.stratum.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "mining-pool.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: stratum
      port: {{ .Values.stratum.port }}
      targetPort: stratum
      protocol: TCP
{{- if ne .Values.pool.implementation "ckpool" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mining-pool.api.name" . }}
  labels:
    {{- include "mining-pool.labels" . | nindent 4 }}
spec:
  # The stats API. ClusterIP: it is not the miner-facing port.
  type: {{ .Values.pool.publicPool.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "mining-pool.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.pool.publicPool.api.port }}
      targetPort: api
{{- end }}
