{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mining-pool.serviceAccountName" . }}
  labels:
    {{- include "mining-pool.labels" . | nindent 4 }}
# The pool has no business talking to the Kubernetes API. It is also the most
# exposed process in the stack — it accepts raw TCP from every miner on the
# network — so it gets no token and no permissions.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
