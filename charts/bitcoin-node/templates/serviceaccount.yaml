{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bitcoin-node.serviceAccountName" . }}
  labels:
    {{- include "bitcoin-node.labels" . | nindent 4 }}
# bitcoind has no business talking to the Kubernetes API, so it gets no token and
# no RoleBinding. If this pod is ever compromised, it should find nothing here.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
