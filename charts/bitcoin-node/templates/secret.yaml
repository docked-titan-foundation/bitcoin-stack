{{- if .Values.rpc.enabled }}
{{- if eq .Values.secret.provider "generated" }}
{{- /*
Generate the RPC password once, then keep it.

`lookup` reads the Secret that is already in the cluster, so an upgrade reuses
the existing password instead of minting a new one. That matters: rotating this
on every `helm upgrade` would silently break every consumer of the node's RPC
(the mining pool, above all) with an auth error that looks nothing like the
cause. During `helm template` (no cluster) lookup returns nothing and a throwaway
password is rendered — which is correct, because nothing is being installed.
*/}}
{{- $name := printf "%s-rpc-credentials" (include "bitcoin-node.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data "rpc-password") -}}
{{- $password = index $existing.data "rpc-password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bitcoin-node.labels" . | nindent 4 }}
  annotations:
    # Never let a chart upgrade or an ArgoCD prune take the credential with it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # bitcoind reads this file via `includeconf=rpc.conf`.
  rpc.conf: |
    rpcuser={{ include "bitcoin-node.rpcUsername" . }}
    rpcpassword={{ $password }}
  # The same secret, addressable on its own, for consumers that need it as an
  # env var rather than a config file (the mining pool).
  rpc-password: {{ $password | quote }}
  rpc-username: {{ include "bitcoin-node.rpcUsername" . | quote }}
{{- end }}
{{- end }}
