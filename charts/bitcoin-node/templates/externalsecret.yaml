{{- if and .Values.rpc.enabled (eq .Values.secret.provider "externalSecret") }}
{{- /*
Sync the RPC password from a real secret manager (OpenBao/Vault) via the External
Secrets Operator, and shape it into exactly the same Secret contract the other
two providers produce: keys `rpc.conf`, `rpc-password`, `rpc-username`.

The `{{ "{{ .rpcPassword }}" }}` dance is deliberate: the outer braces are
consumed by Helm, and what lands in the manifest is an ESO template expression
that ESO expands at sync time. The password never passes through Helm, never
lands in git, and never appears in a rendered manifest.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "bitcoin-node.name" . }}-rpc-credentials
  labels:
    {{- include "bitcoin-node.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secret.externalSecret.secretStore }}
    kind: {{ .Values.secret.externalSecret.storeKind }}
  target:
    name: {{ include "bitcoin-node.name" . }}-rpc-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        rpc.conf: |
          rpcuser={{ include "bitcoin-node.rpcUsername" . }}
          rpcpassword={{ "{{ .rpcPassword }}" }}
        rpc-password: {{ "{{ .rpcPassword }}" }}
        rpc-username: {{ include "bitcoin-node.rpcUsername" . | quote }}
  data:
    - secretKey: rpcPassword
      remoteRef:
        key: {{ .Values.secret.externalSecret.secretPath }}
        property: {{ .Values.secret.externalSecret.property }}
{{- end }}
