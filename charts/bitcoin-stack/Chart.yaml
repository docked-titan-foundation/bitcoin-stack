apiVersion: v2
name: bitcoin-stack
description: A hardened Bitcoin node (Knots or Core) plus mining pool (public-pool or ckpool), in one command.
type: application
version: 1.0.0-beta.1
appVersion: "1.0.0-beta.1"
kubeVersion: ">=1.25.0-0"
keywords:
  - bitcoin
  - bitcoind
  - knots
  - core
  - mining
  - stratum
  - solo-mining
home: https://github.com/docked-titan-foundation/bitcoin-stack
sources:
  - https://github.com/docked-titan-foundation/bitcoin-stack
maintainers:
  - name: Docked Titan Foundation
    url: https://github.com/docked-titan-foundation
dependencies:
  - name: bitcoin-node
    version: 1.0.0-beta.1
    repository: file://../bitcoin-node
    condition: bitcoin-node.enabled
  - name: mining-pool
    version: 1.0.0-beta.1
    repository: file://../mining-pool
    condition: mining-pool.enabled
annotations:
  org.opencontainers.image.title: bitcoin-stack
  org.opencontainers.image.description: Hardened Bitcoin node + mining pool
  org.opencontainers.image.source: https://github.com/docked-titan-foundation/bitcoin-stack
  org.opencontainers.image.licenses: GPL-3.0
  org.opencontainers.image.vendor: Docked Titan Foundation
  # Artifact Hub metadata (https://artifacthub.io/docs/topics/annotations/helm/)
  artifacthub.io/license: GPL-3.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/docked-titan-foundation/bitcoin-stack#readme
    - name: Failure modes
      url: https://github.com/docked-titan-foundation/bitcoin-stack/blob/main/docs/failure-modes.md
    - name: Source
      url: https://github.com/docked-titan-foundation/bitcoin-stack
    - name: Support
      url: https://github.com/docked-titan-foundation/bitcoin-stack/issues
  artifacthub.io/maintainers: |
    - name: Docked Titan Foundation
      email: security.emporium706@passmail.com
  artifacthub.io/signKey: |
    fingerprint: keyless (Sigstore/Fulcio)
    url: https://github.com/docked-titan-foundation/bitcoin-stack#-verifying-the-chart
