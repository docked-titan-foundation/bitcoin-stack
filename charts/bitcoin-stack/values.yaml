# bitcoin-stack — a Bitcoin node and a mining pool that mines on it.
#
#   miner ──stratum:3333──> mining-pool ──RPC + ZMQ──> bitcoin-node ──P2P──> the network
#
# Install both (the default), or set either `enabled: false` to install one. The
# node is useful on its own; the pool is not — it needs a node to mine on, and if
# you disable the node you must point the pool at one yourself.

# ── The wiring ─────────────────────────────────────────────────────────────────
# This is the single source of truth for everything the two charts must agree on.
# Both of them read it: the node serves on these ports with this username, and the
# pool dials exactly the same ones. There is no second copy to forget to update.
#
# rpcHost and secretName use the node chart's fixed, release-independent names, so
# they are correct by construction. Change these only if you are pointing the pool
# at a node that this release does not manage.
global:
  bitcoinNode:
    rpcHost: bitcoin-node-rpc
    rpcPort: 8332
    rpcUsername: bitcoin
    zmqRawBlockPort: 28332
    secretName: bitcoin-node-rpc-credentials

  # ── Hostnames and certificates ───────────────────────────────────────────────
  # Off by default. Nothing below has any effect until an endpoint opts in, and
  # no endpoint does out of the box.
  #
  # A scope is HOW a name gets published: which subdomain it sits under, which
  # cert-manager issuer signs it, whether external-dns creates the record. It is
  # written once here and read by both subcharts, so the domain and the issuers
  # live in exactly one place.
  #
  # WHAT gets published is the other half, and lives with the component that owns
  # the endpoint — `bitcoin-node.networking` and `mining-pool.networking` below.
  # Each endpoint names the scopes it is published in, as a list. Publishing
  # something on the LAN and publicly at the same time is a two-element list; it
  # is not a mode, and there is no second block to keep in sync.
  #
  # `internal` and `external` are ordinary entries, not special names. Rename
  # them, drop one, or add a third.
  #
  # This chart emits annotations for cert-manager and external-dns. It does not
  # install either of them, and does not check that they are running.
  networking:
    # The domain every derived hostname hangs off. Required once anything is
    # published, unless every endpoint pins its own host explicitly.
    baseDomain: ""

    scopes:
      # A name that resolves on the LAN only.
      #
      # This does NOT imply a self-signed certificate. An ACME issuer solving the
      # DNS-01 challenge will issue a publicly-trusted certificate for a host
      # that resolves nowhere on the internet, because DNS-01 proves control of
      # the zone and never connects to the endpoint. `issuer: letsencrypt-prod`
      # is a perfectly normal thing to put here.
      internal:
        subdomain: internal          # -> pool.internal.example.com
        issuer: ""                   # cert-manager issuer; empty = no cert issued
        issuerKind: ClusterIssuer    # ClusterIssuer | Issuer
        publishDns: false            # let external-dns create the record
        ttl: "300"
        annotations: {}              # provider extras, added to Ingresses only

      external:
        subdomain: ""                # -> pool.example.com
        issuer: ""
        issuerKind: ClusterIssuer
        publishDns: false
        ttl: "300"
        # Provider-specific options go here, e.g. for Cloudflare:
        #   external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        annotations: {}

# ── The node ───────────────────────────────────────────────────────────────────
# Every value of the bitcoin-node chart is available here. See its values.yaml —
# these are only the ones worth surfacing.
bitcoin-node:
  enabled: true

  node:
    # knots | core
    implementation: knots
    # main | test | signet | regtest
    network: main
    config:
      dbcache: 4096
      maxconnections: 64
      listen: 1
      prune: 0

  # A mainnet archival node needs ~650-700GB today and grows ~60GB/year.
  storage:
    size: 900Gi

  # limits.memory must be >= dbcache + 2Gi or the chart refuses to install: an
  # OOM kill during a chainstate flush corrupts the datadir.
  resources:
    requests:
      cpu: 500m
      memory: 6Gi
    limits:
      cpu: "4"
      memory: 8Gi

  # generated | existingSecret | externalSecret
  secret:
    provider: generated

  # Which of the node's endpoints get a hostname. Scopes are defined once in
  # global.networking above; this is the list of them each endpoint publishes in.
  networking:
    # A stable name for the address peers connect to. Only meaningful once
    # p2p.service.type is LoadBalancer or NodePort — a ClusterIP has no address
    # worth publishing, and the chart refuses that combination.
    p2p:
      scopes: []

    # RPC. Full control over the node, so publishing it is guarded: the render
    # fails unless rpc.allowSubnet has been narrowed away from 0.0.0.0/0 and
    # every listed scope resolves a certificate. If what you want is a read-only
    # stats page, publish mining-pool.networking.api instead.
    rpc:
      scopes: []

# ── The pool ───────────────────────────────────────────────────────────────────
mining-pool:
  enabled: true

  pool:
    # public-pool | ckpool
    implementation: public-pool
    identifier: "solo"
    # mainnet | testnet. Must match the node's network: a pool decoding mainnet
    # addresses while mining on a testnet node is a misconfiguration the chart
    # will refuse to install (see the guard in templates/_validate.tpl).
    network: mainnet

  stratum:
    port: 3333
    service:
      # The port miners connect to. Stratum is raw TCP, so it needs its own
      # address rather than an HTTP Ingress. On a homelab, MetalLB gives you one.
      type: LoadBalancer
      loadBalancerIP: ""

  # Which of the pool's endpoints get a hostname. Scopes are defined once in
  # global.networking above; this is the list of them each endpoint publishes in.
  networking:
    # The address miners are pointed at. This is the one worth doing: a miner
    # configured with stratum+tcp://stratum.example.com:3333 survives the
    # LoadBalancer IP changing, and one configured with a bare IP does not.
    stratum:
      scopes: []

    # The public-pool JSON stats API, over HTTPS. public-pool only — ckpool has
    # no HTTP surface at all, and the chart refuses that combination rather than
    # pointing an Ingress at a Service it never created.
    api:
      scopes: []
