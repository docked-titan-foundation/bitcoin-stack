---
extends: default

rules:
  # Helm templates are not valid YAML until rendered; ct/helm lint covers those.
  line-length:
    max: 120
    allow-non-breakable-words: true
  comments:
    min-spaces-from-content: 1
  truthy:
    # GitHub Actions' `on:` key.
    check-keys: false
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  charts/*/templates/
  charts/*/charts/
